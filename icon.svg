<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4"/>
  
  <!-- Outer Tyre Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#334155" stroke-width="48"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="14 10"/>
  
  <!-- Inner Rim -->
  <circle cx="256" cy="256" r="118" fill="#1e293b" stroke="#475569" stroke-width="8"/>
  <circle cx="256" cy="256" r="88" fill="#0f172a" stroke="url(#gold)" stroke-width="4"/>
  
  <!-- Center Service Emblem (Wrench & Screwdriver) -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Wrench Tool -->
    <path d="M210 180 L280 250 L260 270 L190 200 Z" fill="url(#gold)"/>
    <path d="M190 160 C175 175 175 200 190 215 L205 200 C200 195 200 185 205 180 C210 175 220 175 225 180 L240 165 C225 150 205 150 190 160 Z" fill="url(#gold)"/>
    
    <!-- Screwdriver / Plier cross -->
    <path d="M250 210 L320 280 L300 300 L230 230 Z" fill="#e2e8f0"/>
    <circle cx="256" cy="256" r="22" fill="url(#gold)"/>
    <circle cx="256" cy="256" r="12" fill="#0f172a"/>
  </g>
  
  <!-- 24x7 Emergency Badge -->
  <g transform="translate(256, 395)">
    <rect x="-95" y="-20" width="190" height="40" rx="20" fill="url(#gold)"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle" letter-spacing="1">24×7 LIVE</text>
  </g>
  
  <!-- Brand Text Top -->
  <text x="256" y="90" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">PUNCTUREWALA</text>
</svg>
